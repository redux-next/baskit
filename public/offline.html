<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16a34a">
  <meta name="description" content="DailyCart is temporarily offline. Check your internet connection and try again.">
  <title>You're Offline | DailyCart</title>
  <style>
    :root {
      color-scheme: light;
      --green: #16a34a;
      --green-dark: #14532d;
      --green-soft: #ecfdf1;
      --orange: #f97316;
      --ink: #163b2b;
      --muted: #64748b;
      --surface: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 20px;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 15%, rgba(187,247,208,.45), transparent 32%),
        radial-gradient(ellipse at 90% 85%, rgba(254,215,170,.32), transparent 30%),
        #fbfdf9;
    }
    .page {
      width: min(100%, 900px);
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
      text-decoration: none;
      color: inherit;
    }
    .brand-mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: white;
      background: linear-gradient(145deg, #22c55e, #15803d);
      box-shadow: 0 8px 18px rgba(22,163,74,.2);
    }
    .brand-name {
      font-size: clamp(1.8rem, 5vw, 2.35rem);
      font-weight: 850;
      letter-spacing: -1.7px;
      line-height: 1;
    }
    .brand-name span { color: var(--orange); }
    .tagline {
      margin: 8px 0 0;
      color: #398253;
      font-size: .88rem;
      letter-spacing: .01em;
    }
    .panel {
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(18px, 4vw, 42px);
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid #e5eee5;
      border-radius: 30px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 22px 70px rgba(22, 72, 42, .08);
    }
    .illustration {
      width: 100%;
      max-width: 360px;
      margin: auto;
    }
    .content { text-align: left; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 999px;
      background: #fff7ed;
      color: #c2410c;
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    h1 {
      margin: 18px 0 10px;
      color: var(--green-dark);
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.05;
      letter-spacing: -1.5px;
    }
    .message {
      max-width: 390px;
      margin: 0;
      color: #52645a;
      font-size: 1.05rem;
      line-height: 1.7;
    }
    .retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      margin-top: 25px;
      padding: 0 25px;
      border: 0;
      border-radius: 14px;
      background: var(--green);
      color: white;
      font: inherit;
      font-size: 1rem;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 9px 20px rgba(22,163,74,.2);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .retry:hover { background: #15803d; transform: translateY(-2px); box-shadow: 0 12px 24px rgba(22,163,74,.25); }
    .retry:focus-visible { outline: 3px solid #86efac; outline-offset: 4px; }
    .retry:disabled { opacity: .75; cursor: wait; transform: none; }
    .status {
      min-height: 1.4em;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: .86rem;
    }
    .reassurance {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 22px auto 0;
      padding: 15px 18px;
      border: 1px solid #d9f1df;
      border-radius: 16px;
      background: var(--green-soft);
      color: #245b38;
      font-size: .92rem;
      line-height: 1.5;
    }
    .reassurance svg { flex: 0 0 auto; color: var(--green); }
    footer { margin-top: 24px; color: #94a39a; font-size: .8rem; }
    @media (max-width: 650px) {
      body { padding: 22px 15px; }
      .brand { margin-bottom: 22px; }
      .panel { grid-template-columns: 1fr; gap: 12px; padding: 25px 21px 28px; border-radius: 24px; }
      .illustration { max-width: 230px; }
      .content { text-align: center; }
      .message { margin-inline: auto; }
      .retry { width: 100%; }
      .reassurance { align-items: flex-start; text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="brand" href="/" aria-label="DailyCart home">
      <span class="brand-mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
          <path d="M4 7h3l3.1 14.2a2 2 0 0 0 2 1.6h12.4a2 2 0 0 0 1.9-1.4L29 11H9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 12l2.1-4.5M19 12l2.1-4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="13.5" cy="27" r="2" fill="currentColor"/><circle cx="24" cy="27" r="2" fill="currentColor"/>
        </svg>
      </span>
      <span>
        <span class="brand-name">Daily<span>Cart</span></span>
        <span class="tagline">Fresh groceries. Delivered daily.</span>
      </span>
    </a>

    <section class="panel" aria-labelledby="offline-title">
      <svg class="illustration" viewBox="0 0 360 300" role="img" aria-label="A friendly grocery bag beside a disconnected Wi-Fi symbol">
        <ellipse cx="180" cy="273" rx="145" ry="16" fill="#dcfce7"/>
        <path d="M65 99c-18-26 10-54 36-40 8-32 55-31 62 2 28-7 46 26 27 45H65Z" fill="#e0f2fe"/>
        <path d="M224 72c-12-19 8-39 27-28 8-24 43-22 47 3 20-5 32 18 18 31h-92Z" fill="#e0f2fe"/>
        <g fill="none" stroke="#94a3b8" stroke-width="12" stroke-linecap="round">
          <path d="M111 105c37-34 101-34 138 0"/>
          <path d="M132 128c25-23 70-23 95 0"/>
          <path d="M153 151c14-13 39-13 53 0"/>
        </g>
        <path d="M180 166v2" stroke="#94a3b8" stroke-width="13" stroke-linecap="round"/>
        <circle cx="268" cy="143" r="23" fill="#ef4444"/>
        <path d="M268 130v15m0 8v1" stroke="white" stroke-width="4" stroke-linecap="round"/>
        <g transform="translate(54 113)">
          <path d="M35 45c-3-30 16-48 31-48 15 0 29 19 28 48" fill="#16a34a"/>
          <path d="M58 43c-7-26 3-48 17-51 12 13 10 33-2 51" fill="#4ade80"/>
          <path d="M83 43c1-20 13-34 26-32 5 15-4 29-20 37" fill="#22c55e"/>
          <path d="M15 54h112l-12 119H27L15 54Z" fill="#fbbf69" stroke="#e99a38" stroke-width="3" stroke-linejoin="round"/>
          <path d="M15 54h112l-9 18H24l-9-18Z" fill="#f59e0b"/>
          <path d="M48 102c5-8 15-8 20 0m20 0c5-8 15-8 20 0" stroke="#3f3527" stroke-width="4" stroke-linecap="round" fill="none"/>
          <path d="M66 122c8 10 20 10 28 0" stroke="#3f3527" stroke-width="4" stroke-linecap="round" fill="none"/>
          <circle cx="43" cy="116" r="5" fill="#fb8b72"/><circle cx="111" cy="116" r="5" fill="#fb8b72"/>
          <path d="M46 173v10m57-10v10" stroke="#334155" stroke-width="9" stroke-linecap="round"/>
          <path d="M42 52c-2-16 6-26 17-26s18 10 17 26" fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
        </g>
        <path d="M36 226c-12-18-6-34 9-40 0 17 0 28-9 40Zm-3 5c-19-9-31-2-33 12 15 2 26-2 33-12Z" fill="#86d69a"/>
        <path d="M322 225c12-18 6-34-9-40 0 17 0 28 9 40Zm3 6c19-9 31-2 33 12-15 2-26-2-33-12Z" fill="#86d69a"/>
      </svg>

      <div class="content">
        <span class="eyebrow"><span aria-hidden="true">●</span> Connection interrupted</span>
        <h1 id="offline-title">You're offline</h1>
        <p class="message">Looks like your internet connection took a little break. Check your connection and try again.</p>
        <button class="retry" id="retryButton" type="button">
          <svg id="retryIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 7v5h-5M4 17v-5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="retryText">Try Again</span>
        </button>
        <p class="status" id="statusMessage" role="status" aria-live="polite"></p>
      </div>
    </section>

    <div class="reassurance">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3 4.5 6v5.2c0 4.5 3.2 7.8 7.5 9.8 4.3-2 7.5-5.3 7.5-9.8V6L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="m8.8 12 2.1 2.1 4.4-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Don't worry! Your cart and preferences are safe on this device.</span>
    </div>
    <footer>DailyCart · Fresh groceries. Delivered daily.</footer>
  </main>

  <script>
    const retryButton = document.getElementById("retryButton");
    const retryText = document.getElementById("retryText");
    const statusMessage = document.getElementById("statusMessage");

    retryButton.addEventListener("click", () => {
      retryButton.disabled = true;
      retryText.textContent = "Checking connection...";
      statusMessage.textContent = "Trying to reconnect…";

      if (navigator.onLine) {
        window.location.href = "/";
      } else {
        retryText.textContent = "Try Again";
        statusMessage.textContent = "Still offline. Please check your internet connection.";
        retryButton.disabled = false;
      }
    });

    window.addEventListener("online", () => {
      statusMessage.textContent = "Connection restored. Taking you back to DailyCart…";
      window.location.href = "/";
    });
  </script>
</body>
</html>
