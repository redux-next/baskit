<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f8f4">
    <meta name="description" content="DailyCart is waiting for your internet connection to return.">
    <title>You're Offline | DailyCart</title>
    <style>
      :root {
        color-scheme: light;
        --green: #176344;
        --green-dark: #123c2a;
        --green-bright: #27834e;
        --green-soft: #edf5ed;
        --ink: #1b2d22;
        --muted: #65756a;
        --coral: #e8795b;
        --line: #e5ebe3;
        --surface: #fff;
      }

      * { box-sizing: border-box; }

      html { min-width: 320px; background: #f6f8f4; }

      body {
        display: flex;
        min-height: 100vh;
        min-height: 100svh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding:
          max(28px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        overflow-x: hidden;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 9% 12%, rgba(205, 231, 203, .55), transparent 30rem),
          radial-gradient(ellipse at 94% 88%, rgba(249, 226, 204, .45), transparent 27rem),
          #f6f8f4;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: min(100%, 1032px);
        margin: auto;
      }

      .brand {
        display: flex;
        width: fit-content;
        align-items: center;
        margin: 0 auto 25px;
        padding: 5px 13px;
        border: 1px solid rgba(229, 235, 227, .9);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 5px 18px rgba(27, 62, 38, .045);
      }

      .brand img {
        display: block;
        width: clamp(142px, 34vw, 184px);
        height: auto;
      }

      .panel {
        display: grid;
        min-height: 496px;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        align-items: center;
        overflow: hidden;
        border: 1px solid rgba(224, 232, 222, .92);
        border-radius: 30px;
        background: rgba(255, 255, 255, .96);
        box-shadow: 0 26px 75px rgba(37, 75, 43, .105), 0 3px 10px rgba(37, 75, 43, .035);
      }

      .scene {
        position: relative;
        display: grid;
        min-height: 496px;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 51% 47%, rgba(255,255,255,.98) 0 24%, transparent 62%),
          linear-gradient(145deg, #f1f8ef, #eaf3e9 62%, #f7f5ea);
      }

      .scene::before,
      .scene::after {
        position: absolute;
        width: 300px;
        height: 300px;
        border: 1px solid rgba(91, 147, 100, .10);
        border-radius: 50%;
        content: "";
      }

      .scene::after { width: 370px; height: 370px; }

      .scene-art {
        position: relative;
        z-index: 1;
        display: block;
        width: min(91%, 410px);
        height: auto;
        overflow: visible;
      }

      .produce-float { animation: float 4.8s ease-in-out infinite; }
      .wifi-wave { transition: stroke .35s ease, opacity .35s ease; }
      .wifi-online { display: none; }
      .signal-slash { transform-origin: center; transition: opacity .25s ease, transform .35s ease; }

      .panel.is-online .wifi-offline { display: none; }
      .panel.is-online .wifi-online { display: inline; }
      .panel.is-online .signal-slash { opacity: 0; transform: scale(.65) rotate(-35deg); }
      .panel.is-online .produce-float { animation: happy-bounce .65s ease-in-out 2; }

      .content {
        padding: clamp(30px, 5vw, 60px);
      }

      .eyebrow {
        display: inline-flex;
        min-height: 34px;
        align-items: center;
        gap: 9px;
        padding: 0 12px;
        border: 1px solid #f4d8cb;
        border-radius: 999px;
        background: #fff7f2;
        color: #a64c30;
        font-size: .73rem;
        font-weight: 760;
        letter-spacing: .075em;
        text-transform: uppercase;
        transition: color .25s ease, border-color .25s ease, background .25s ease;
      }

      .status-dot {
        position: relative;
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--coral);
      }

      .status-dot::after {
        position: absolute;
        inset: -4px;
        border: 1px solid currentColor;
        border-radius: 50%;
        color: var(--coral);
        content: "";
        animation: pulse 2s ease-out infinite;
      }

      .is-online .eyebrow {
        border-color: #cde7d1;
        background: #eff8ef;
        color: #176344;
      }

      .is-online .status-dot { background: #279451; }
      .is-online .status-dot::after { color: #279451; }

      h1 {
        max-width: 440px;
        margin: 20px 0 13px;
        color: var(--green-dark);
        font-size: clamp(2.15rem, 4.2vw, 3.55rem);
        font-weight: 760;
        letter-spacing: -.065em;
        line-height: 1.04;
      }

      .message {
        max-width: 410px;
        margin: 0;
        color: #5f6e63;
        font-size: clamp(.98rem, 1.4vw, 1.08rem);
        line-height: 1.75;
      }

      .retry {
        display: inline-flex;
        min-width: 162px;
        min-height: 53px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 25px;
        padding: 0 22px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(135deg, #21804d, #176344);
        box-shadow: 0 9px 20px rgba(23, 99, 68, .2);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-size: .96rem;
        font-weight: 720;
        transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .retry:hover {
        transform: translateY(-2px);
        background: linear-gradient(135deg, #176f41, #124e36);
        box-shadow: 0 12px 23px rgba(23, 99, 68, .25);
      }

      .retry:active { transform: translateY(0); }
      .retry:focus-visible { outline: 3px solid #9acc9c; outline-offset: 4px; }
      .retry:disabled { cursor: wait; opacity: .8; transform: none; }
      .retry[hidden] { display: none; }

      .retry-spinner {
        display: none;
        width: 17px;
        height: 17px;
        border: 2px solid rgba(255,255,255,.45);
        border-top-color: #fff;
        border-radius: 50%;
      }

      .retry.is-loading .retry-icon { display: none; }
      .retry.is-loading .retry-spinner { display: block; animation: spin .75s linear infinite; }

      .status-message {
        min-height: 1.5em;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: .84rem;
        line-height: 1.5;
      }

      .waiting-note {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 27px;
        padding-top: 19px;
        border-top: 1px solid var(--line);
        color: #6b796e;
        font-size: .82rem;
        line-height: 1.5;
      }

      .waiting-icon {
        display: grid;
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 10px;
        background: var(--green-soft);
        color: var(--green);
      }

      footer {
        margin-top: 21px;
        color: #7a887c;
        font-size: .8rem;
        letter-spacing: .01em;
        text-align: center;
      }

      @keyframes pulse {
        0% { opacity: .65; transform: scale(.65); }
        100% { opacity: 0; transform: scale(1.7); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }

      @keyframes happy-bounce {
        0%, 100% { transform: translateY(0); }
        45% { transform: translateY(-9px); }
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 720px) {
        body {
          justify-content: flex-start;
          padding:
            max(20px, env(safe-area-inset-top))
            max(15px, env(safe-area-inset-right))
            max(16px, env(safe-area-inset-bottom))
            max(15px, env(safe-area-inset-left));
        }

        .page { width: min(100%, 520px); margin: auto; }
        .brand { margin-bottom: 17px; }
        .panel { grid-template-columns: 1fr; min-height: 0; border-radius: 25px; }
        .scene { min-height: 0; height: clamp(205px, 58vw, 285px); }
        .scene::before { width: 230px; height: 230px; }
        .scene::after { width: 285px; height: 285px; }
        .scene-art { width: min(76%, 310px); max-height: 270px; }
        .content { padding: 5px clamp(23px, 7vw, 38px) 28px; text-align: center; }
        .eyebrow { min-height: 31px; font-size: .68rem; }
        h1 { margin: 15px auto 10px; font-size: clamp(2rem, 9.2vw, 2.8rem); }
        .message { margin-inline: auto; font-size: .96rem; line-height: 1.65; }
        .retry { width: 100%; margin-top: 21px; }
        .waiting-note { justify-content: center; margin-top: 21px; padding-top: 16px; text-align: left; }
        .status-message { font-size: .82rem; }
        footer { margin-top: 16px; font-size: .75rem; }
      }

      @media (max-width: 360px) {
        body { padding-inline: max(12px, env(safe-area-inset-left)); }
        .panel { border-radius: 21px; }
        .scene { height: 195px; }
        .scene-art { width: min(79%, 270px); }
        .content { padding-inline: 19px; }
        h1 { font-size: 2rem; }
      }

      @media (max-height: 700px) and (min-width: 721px) {
        body { justify-content: flex-start; padding-block: max(16px, env(safe-area-inset-top)); }
        .brand { margin-bottom: 14px; }
        .panel { min-height: 390px; }
        .scene { min-height: 390px; }
        .scene-art { width: min(84%, 350px); }
        .content { padding-block: 35px; }
        footer { margin-top: 13px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="brand" href="/" aria-label="DailyCart home">
        <img src="/dailycart_loading_logo.png" width="1914" height="636" alt="DailyCart">
      </a>

      <section class="panel" id="offlinePanel" aria-labelledby="pageTitle">
        <div class="scene">
          <svg class="scene-art" viewBox="0 0 420 340" role="img" aria-labelledby="sceneTitle sceneDescription">
            <title id="sceneTitle">DailyCart is waiting for your connection</title>
            <desc id="sceneDescription">A fresh grocery tote sits beneath a Wi-Fi signal that reconnects when internet access returns.</desc>
            <ellipse cx="210" cy="300" rx="145" ry="15" fill="#cfe2ca" opacity=".58"/>
            <circle cx="210" cy="173" r="127" fill="#fff" opacity=".67"/>
            <g opacity=".9">
              <path d="M92 236c-21-19-17-44 4-54 9 23 10 39-4 54Zm-2 7c-27-6-44 7-42 28 22-1 36-10 42-28Z" fill="#8fca8d"/>
              <path d="M326 231c19-20 15-44-6-53-8 22-8 39 6 53Zm2 8c27-7 44 5 44 26-22 0-37-9-44-26Z" fill="#a5d49c"/>
              <circle cx="77" cy="155" r="5" fill="#e9b653"/>
              <circle cx="343" cy="112" r="4" fill="#e9b653"/>
              <path d="M91 115h8m-4-4v8m218 95h8m-4-4v8" stroke="#a5c99e" stroke-width="2.5" stroke-linecap="round"/>
            </g>
            <g transform="translate(116 157)">
              <path d="M34 65c-3-31 13-57 30-58 13 0 24 16 24 45-11 13-31 21-54 13Z" fill="#ed8654"/>
              <path d="M55 56c0-34 16-58 32-56 12 16 7 39-11 59" fill="#f3a05d"/>
              <path d="M65 8c-5-13 3-21 17-21" fill="none" stroke="#5b9354" stroke-width="6" stroke-linecap="round"/>
              <path d="M98 68c-9-28-1-52 15-57 17 10 18 35 1 57" fill="#72ad68"/>
              <path d="M103 35c-5-15-18-22-29-17 1 15 11 25 27 27" fill="#82bd72"/>
              <path d="M78 77c-17-27-9-53 8-59 19 10 21 34 3 60" fill="#52975d"/>
              <path d="M76 37c-6-15-19-21-29-15 2 14 13 24 29 25" fill="#72b56b"/>
              <path d="M14 101h163l-15 122H29L14 101Z" fill="#f3bc75" stroke="#d99b4e" stroke-width="3" stroke-linejoin="round"/>
              <path d="M14 101h163l-8 18H22l-8-18Z" fill="#e9a95e"/>
              <path d="M73 105c-3-21 7-36 20-36s23 15 20 36" fill="none" stroke="#c98946" stroke-width="7" stroke-linecap="round"/>
              <path d="M56 157c5-7 14-7 19 0m31 0c5-7 14-7 19 0" fill="none" stroke="#43372b" stroke-width="4" stroke-linecap="round"/>
              <path d="M78 179c10 11 24 11 34 0" fill="none" stroke="#43372b" stroke-width="4" stroke-linecap="round"/>
              <circle cx="49" cy="170" r="6" fill="#e88970" opacity=".72"/>
              <circle cx="139" cy="170" r="6" fill="#e88970" opacity=".72"/>
              <path d="M54 223v9m78-9v9" stroke="#456346" stroke-width="9" stroke-linecap="round"/>
            </g>
            <g transform="translate(221 31)" fill="none" stroke-linecap="round">
              <circle cx="70" cy="70" r="61" fill="#fff" stroke="#e1ecdf" stroke-width="2"/>
              <g class="wifi-offline wifi-wave" stroke="#a5b2a5" stroke-width="9">
                <path d="M31 58c22-20 56-20 78 0"/>
                <path d="M45 73c14-13 36-13 50 0"/>
                <path d="M59 88c6-6 16-6 22 0"/>
                <path d="M70 101v1"/>
              </g>
              <path class="signal-slash" d="m37 104 70-70" stroke="#e8795b" stroke-width="8"/>
              <g class="wifi-online wifi-wave" stroke="#27834e" stroke-width="9">
                <path d="M31 58c22-20 56-20 78 0"/>
                <path d="M45 73c14-13 36-13 50 0"/>
                <path d="M59 88c6-6 16-6 22 0"/>
                <path d="M70 101v1"/>
              </g>
              <g class="wifi-online">
                <circle cx="113" cy="111" r="17" fill="#27834e"/>
                <path d="m105 111 6 6 11-12" stroke="#fff" stroke-width="3.5"/>
              </g>
              <circle cx="25" cy="111" r="5" fill="#e6b95d"/>
              <circle cx="116" cy="20" r="4" fill="#92c58b"/>
            </g>
          </svg>
        </div>

        <div class="content">
          <span class="eyebrow" id="connectionBadge">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="badgeText">Connection interrupted</span>
          </span>
          <h1 id="pageTitle">Oops! You're Offline</h1>
          <p class="message" id="description">It looks like your internet connection is taking a little break. Don't worry, we'll be ready when you're back.</p>

          <button class="retry" id="retryButton" type="button">
            <svg class="retry-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 7v5h-5M4 17v-5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="retry-spinner" aria-hidden="true"></span>
            <span id="retryText">Try Again</span>
          </button>
          <p class="status-message" id="statusMessage" role="status" aria-live="polite"></p>

          <div class="waiting-note">
            <span class="waiting-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                <path d="M12 8v4l2.5 2.5M20 12a8 8 0 1 1-2.34-5.66L20 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20 4v4h-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span id="waitingText">DailyCart is waiting for your connection to return.</span>
          </div>
        </div>
      </section>

      <footer>DailyCart · Fresh essentials, delivered daily.</footer>
    </main>

    <script>
      (() => {
        const panel = document.getElementById("offlinePanel");
        const title = document.getElementById("pageTitle");
        const description = document.getElementById("description");
        const badgeText = document.getElementById("badgeText");
        const retryButton = document.getElementById("retryButton");
        const retryText = document.getElementById("retryText");
        const statusMessage = document.getElementById("statusMessage");
        const waitingText = document.getElementById("waitingText");
        const redirectStorageKey = "dailycart-offline-redirect";
        const redirectDelay = 1300;
        let connectivityRequest = null;
        let redirectTimer = null;
        let redirected = false;
        let connectionRevision = 0;

        function safeDestination(candidate) {
          if (!candidate) return null;

          try {
            const destination = new URL(candidate, window.location.origin);
            if (
              destination.origin !== window.location.origin ||
              destination.username ||
              destination.password ||
              destination.pathname === "/offline.html"
            ) {
              return null;
            }
            return destination.href;
          } catch {
            return null;
          }
        }

        function getDestination() {
          const current = new URL(window.location.href);

          if (current.pathname !== "/offline.html") {
            return safeDestination(`${current.pathname}${current.search}${current.hash}`)
              || new URL("/", window.location.origin).href;
          }

          const requestedPath = safeDestination(current.searchParams.get("returnTo"));
          const sameOriginReferrer = safeDestination(document.referrer);
          return requestedPath || sameOriginReferrer || new URL("/", window.location.origin).href;
        }

        const destination = getDestination();

        function wasRedirectAttempted() {
          try {
            return window.sessionStorage.getItem(redirectStorageKey) === destination;
          } catch {
            return false;
          }
        }

        function rememberRedirectAttempt() {
          try {
            window.sessionStorage.setItem(redirectStorageKey, destination);
          } catch {
            // The page can still recover if storage is unavailable.
          }
        }

        function clearRedirectAttempt() {
          try {
            window.sessionStorage.removeItem(redirectStorageKey);
          } catch {
            // Storage is optional; a new online event can still retry.
          }
        }

        function setOffline(message) {
          connectionRevision += 1;
          if (redirectTimer !== null) {
            window.clearTimeout(redirectTimer);
            redirectTimer = null;
          }
          panel.classList.remove("is-online");
          title.textContent = "Oops! You're Offline";
          description.textContent = "It looks like your internet connection is taking a little break. Don't worry, we'll be ready when you're back.";
          badgeText.textContent = "Connection interrupted";
          waitingText.textContent = "DailyCart is waiting for your connection to return.";
          retryButton.hidden = false;
          retryButton.disabled = false;
          retryButton.classList.remove("is-loading");
          retryText.textContent = "Try Again";
          statusMessage.textContent = message || "";
        }

        function checkConnectivity(force) {
          if (connectivityRequest) return connectivityRequest;
          if (!force && !navigator.onLine) return Promise.resolve(false);

          const controller = new AbortController();
          const timeout = window.setTimeout(() => controller.abort(), 4500);
          const probeUrl = new URL("/manifest.json", window.location.origin);
          probeUrl.searchParams.set("connectivity-check", Date.now().toString());

          connectivityRequest = (async () => {
            try {
              const response = await fetch(probeUrl.href, {
                method: "GET",
                cache: "no-store",
                credentials: "same-origin",
                headers: { "Cache-Control": "no-cache" },
                signal: controller.signal
              });
              return response.ok;
            } catch {
              return false;
            } finally {
              window.clearTimeout(timeout);
              connectivityRequest = null;
            }
          })();

          return connectivityRequest;
        }

        function showOnline(retryRequested) {
          if (redirected || (panel.classList.contains("is-online") && !retryRequested)) return;
          if (retryRequested && redirectTimer !== null) {
            window.clearTimeout(redirectTimer);
            redirectTimer = null;
          }

          panel.classList.add("is-online");
          title.textContent = "You're back online!";
          description.textContent = "Your connection has been restored. Taking you back to DailyCart...";
          badgeText.textContent = "Connected";

          if (!retryRequested && wasRedirectAttempted()) {
            description.textContent = "Your connection is back. Try again to reopen DailyCart.";
            waitingText.textContent = "Your last return attempt was interrupted. You can safely try again.";
            retryButton.hidden = false;
            retryButton.disabled = false;
            retryButton.classList.remove("is-loading");
            retryText.textContent = "Open DailyCart";
            statusMessage.textContent = "";
            return;
          }

          waitingText.textContent = "Taking you back to where you left off...";
          retryButton.hidden = true;
          statusMessage.textContent = "You're back online! DailyCart is ready.";
          rememberRedirectAttempt();

          const scheduledRevision = connectionRevision;
          redirectTimer = window.setTimeout(async () => {
            redirectTimer = null;
            const stillConnected = await checkConnectivity(true);
            if (!stillConnected || scheduledRevision !== connectionRevision) {
              setOffline("Your connection dropped again. We'll keep waiting.");
              return;
            }
            redirected = true;
            window.location.replace(destination);
          }, redirectDelay);
        }

        async function verifyAndUpdate(force, retryRequested) {
          const connected = await checkConnectivity(force);
          if (connected) {
            showOnline(retryRequested);
          } else {
            setOffline();
          }
          return connected;
        }

        async function retryConnection() {
          if (retryButton.disabled || redirected) return;

          clearRedirectAttempt();
          retryButton.disabled = true;
          retryButton.classList.add("is-loading");
          retryText.textContent = "Checking connection...";
          statusMessage.textContent = "Checking your internet connection...";

          const connected = await checkConnectivity(true);
          if (connected) {
            showOnline(true);
          } else {
            setOffline("Still offline. Please check your internet connection and try again.");
          }
        }

        retryButton.addEventListener("click", retryConnection);
        window.addEventListener("online", () => {
          connectionRevision += 1;
          statusMessage.textContent = "Connection detected. Checking internet access...";
          verifyAndUpdate(true, true);
        });
        window.addEventListener("offline", () => {
          clearRedirectAttempt();
          setOffline("Your device lost its connection. We'll keep checking.");
        });
        window.addEventListener("focus", () => verifyAndUpdate(true));
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") verifyAndUpdate(true);
        });

        window.setInterval(() => {
          if (
            !document.hidden &&
            navigator.onLine &&
            !panel.classList.contains("is-online")
          ) {
            verifyAndUpdate(false);
          }
        }, 45000);

        verifyAndUpdate(true);
      })();
    </script>
  </body>
</html>
